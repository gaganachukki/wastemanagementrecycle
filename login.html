<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | STACKLY</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">

    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="tsparticles"></div>

    <div class="login-page">
        <!-- Visual Side -->
        <div class="login-visual">
            <div class="login-visual-bg"></div>
            <h1>Welcome back to the loop.</h1>
            <p>Manage your pickups, track your environmental impact, and help build a circular future.</p>
        </div>

        <!-- Form Side -->
        <div class="login-form-container">
            <a href="index.html" class="login-brand">
                <img src="assets/images/logo.webp" alt="STACKLY" style="height: 40px; width: auto; object-fit: contain;">
            </a>

            <div class="role-selector" style="display:flex; gap:16px; margin-bottom:12px;">
                <button type="button" id="btn-client" onclick="setRole('client')" class="role-btn active" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px; border-radius:8px; border:1px solid var(--primary); background:transparent; color:#111; cursor:pointer;">
                    <i id="icon-client" class="fa-solid fa-user" style="color:var(--primary); font-size:1.5rem; margin-bottom:8px;"></i>
                    <span style="font-weight:600;">Client</span>
                </button>
                <button type="button" id="btn-admin" onclick="setRole('admin')" class="role-btn" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px; border-radius:8px; border:1px solid #e2e8f0; background:transparent; color:#888; cursor:pointer;">
                    <i id="icon-admin" class="fa-solid fa-shield-halved" style="color:#888; font-size:1.5rem; margin-bottom:8px;"></i>
                    <span style="font-weight:500;">Admin</span>
                </button>
            </div>

            <form id="authForm" class="login-form">
                <div class="form-group" style="margin-bottom:12px;">
                    <label style="font-weight:bold; margin-bottom:8px; display:block; color:#111;">Email Address</label>
                    <input type="email" class="form-control" placeholder="Email Address" required>
                </div>
                
                <div class="form-group" style="margin-bottom:12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <label style="font-weight:bold; margin:0; color:#111;">Password</label>
                        <a href="404.html" style="color:var(--primary); text-decoration:none; font-size:0.9rem; font-weight:600;">Forgot Password?</a>
                    </div>
                    <div style="position:relative;">
                        <input type="password" class="form-control" placeholder="Password" required style="padding-right:40px;">
                        <i class="fa-solid fa-eye" style="position:absolute; right:16px; top:50%; transform:translateY(-50%); color:#888; cursor:pointer;"></i>
                    </div>
                </div>

                <div class="form-options" style="margin-bottom:12px;">
                    <label style="display: flex; align-items: center; gap: 8px; font-weight: 500; margin: 0; color:#555;">
                        <input type="checkbox" style="accent-color:var(--primary); width:16px; height:16px;" checked> Remember Me
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding:14px; font-weight:bold; font-size:1rem; border-radius:8px;">Login</button>
                
                <p style="text-align:center; margin-top:12px; color:#555; font-size:0.95rem;">
                    Don't have an account? <a href="signup.html" style="color:var(--primary); font-weight:bold; text-decoration:none;">Create Account</a>
                </p>
            </form>
        </div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-engine"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles/tsparticles.bundle.min.js"></script>
    <script src="js/animations.js"></script>

    <script>
        let selectedRole = 'client';
        function setRole(role) {
            selectedRole = role;
            
            const btnClient = document.getElementById('btn-client');
            const btnAdmin = document.getElementById('btn-admin');
            const iconClient = document.getElementById('icon-client');
            const iconAdmin = document.getElementById('icon-admin');
            
            if(role === 'client') {
                btnClient.style.borderColor = 'var(--primary)';
                btnClient.style.color = '#111';
                iconClient.style.color = 'var(--primary)';
                
                btnAdmin.style.borderColor = '#e2e8f0';
                btnAdmin.style.color = '#888';
                iconAdmin.style.color = '#888';
            } else {
                btnAdmin.style.borderColor = 'var(--primary)';
                btnAdmin.style.color = '#111';
                iconAdmin.style.color = 'var(--primary)';
                
                btnClient.style.borderColor = '#e2e8f0';
                btnClient.style.color = '#888';
                iconClient.style.color = '#888';
            }
        }
        
        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if(selectedRole === 'client') {
                window.location.href = 'userdashboard.html';
            } else {
                window.location.href = 'admindashboard.html';
            }
        });
    </script>
</body>
</html>
