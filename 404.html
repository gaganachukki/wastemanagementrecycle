<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found | STACKLY</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/404.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="tsparticles" style="position: absolute; width: 100%; height: 100%; z-index: 1;"></div>

    <div class="error-page">
        <div class="error-content">
            <div class="error-icon">
                <i class="fa-solid fa-recycle fa-spin-pulse"></i>
            </div>
            <h1>404</h1>
            <h2>Oops! Page Not Found</h2>
            <p>Looks like this page got recycled or was sent to the wrong bin. Let's get you back on track to a zero-waste future.</p>
            <a href="index.html" class="btn-return">
                <i class="fa-solid fa-arrow-left"></i> Return to Homepage
            </a>
        </div>
    </div>

    <!-- Scripts for background particles -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-engine"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles/tsparticles.bundle.min.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
